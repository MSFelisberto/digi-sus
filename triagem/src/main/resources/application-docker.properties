spring.application.name=triagem
server.port=0
eureka.client.service-url.defaultZone=http://server:8761/eureka
logging.level.root=INFO
logging.level.br.com.dgs=DEBUG

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

services.autenticacao.url=http://autenticacao

service.id=triagem-service
service.secret=${TRIAGEM_SECRET}
